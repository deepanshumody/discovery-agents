name: CI

on:
  push:
    branches: [main]
  pull_request:

# The entire pipeline runs keyless via the deterministic MockLLMClient, so CI
# needs no API secrets.
env:
  DISCOVERY_PROVIDER: mock

jobs:
  quality:
    name: lint • type • test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q

      - name: Demo smoke (keyless)
        run: python -m discovery_agents.cli --output outputs/ci

      - name: Eval regression gate (keyless)
        run: python -m discovery_agents.cli --eval

  ml:
    name: ml-infra (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, ml + dask + dev extras, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml,dask]"

      - name: Mypy (mlinfra typed against real torch)
        run: mypy

      - name: Pytest (mlinfra)
        run: pytest -q tests/mlinfra

      - name: Train smoke (curate -> train -> export, CPU)
        run: python -m discovery_agents.mlinfra.cli train --smoke

      - name: Benchmark smoke (sample, tiny — guards the CLI wiring, no download)
        run: python -m discovery_agents.mlinfra.cli benchmark --steps 5 --out /tmp/bench-smoke
